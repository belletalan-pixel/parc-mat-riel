<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2630">
<title>Matériel atelier – Paganetti Thermique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --fond:#E8ECEF; --papier:#FFFFFF; --encre:#1C2630; --gris:#5A6774; --trait:#CDD4DA;
  --etiquette:#F2C230; --libre:#2E7D4F; --pris:#C26A12; --retard:#B3261E; --resa:#2B5FA6;
  --r:6px;
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--encre); background:var(--fond); box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-size:16px;line-height:1.45;background:var(--fond);padding-bottom:env(safe-area-inset-bottom,0px)}

/* En-tête */
.top{position:sticky;top:0;z-index:5;background:var(--encre);color:#fff;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.top-in{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand-titre{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.55rem;line-height:1}
.brand-sous{color:#AAB6C1;font-size:.88rem}
.moi{margin-left:auto;font-size:.88rem;color:#C3CDD6;display:flex;align-items:baseline;gap:8px}
.moi strong{color:#fff;font-weight:600}
.btn-deco{border:0;background:none;color:var(--etiquette);font:600 .88rem 'Barlow',sans-serif;cursor:pointer;padding:4px 0}
nav{display:flex;gap:0;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav[hidden]{display:none}
.tab{appearance:none;border:0;background:transparent;color:#C3CDD6;font:600 1rem 'Barlow',sans-serif;
  padding:10px 9px 9px;border-bottom:3px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;flex:0 0 auto}
.tab.on{color:#fff;border-bottom-color:var(--etiquette)}
@media (max-width:440px){.tab{font-size:.9rem;padding:10px 6px 9px}.compteur{margin-left:3px}}
.tab[hidden]{display:none}
.compteur{display:inline-block;min-width:1.5em;padding:0 .4em;margin-left:4px;border-radius:999px;
  background:var(--etiquette);color:#2A2100;font-size:.8rem;text-align:center}
.compteur:empty{display:none}
.compteur.alerte{background:var(--retard);color:#fff}
.connexion-vide{height:8px}

main{max-width:760px;margin:0 auto;padding:8px 16px 56px}
h1,h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:1.9rem;margin-top:10px}
h2{font-size:1.3rem;margin-bottom:8px}
.bloc{margin-top:24px}
.resume{margin:-2px 0 10px;color:var(--gris)}
.txt-retard{color:var(--retard)}

/* Étiquette d'identification */
.tag{display:inline-block;position:relative;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:.98rem;line-height:1.3;background:var(--etiquette);color:#2A2100;
  padding:2px 9px 2px 18px;border-radius:3px 7px 7px 3px;white-space:nowrap}
.tag::before{content:'';position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;
  border-radius:50%;background:var(--fond);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.tag-xl{font-size:1.3rem;padding:4px 14px 4px 26px}
.tag-xl::before{left:9px;width:8px;height:8px;margin-top:-4px}

/* Listes */
.lignes{list-style:none;margin:0;padding:0;background:var(--papier);border:1px solid var(--trait);
  border-radius:var(--r);overflow:hidden}
.lignes>li+li{border-top:1px solid var(--trait)}
.ligne{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"tag main" ". fin";
  gap:2px 12px;padding:12px 14px 12px 12px;color:inherit;text-decoration:none;border-left:5px solid var(--trait)}
@media (min-width:620px){
  .ligne{grid-template-columns:auto 1fr auto;grid-template-areas:"tag main fin";align-items:center}
  .l-fin{text-align:right}
}
.ligne .tag{grid-area:tag;align-self:start;margin-top:1px}
.l-main{grid-area:main;min-width:0}
.l-fin{grid-area:fin;font-size:.9rem;color:var(--gris)}
.l-titre{display:block;font-weight:600}
.l-meta{display:block;color:var(--gris);font-size:.92rem}
.ligne:hover{background:#F4F6F8}
.is-libre{border-left-color:var(--libre)}
.is-pris{border-left-color:var(--pris)}
.is-retard{border-left-color:var(--retard)}
.is-resa{border-left-color:var(--resa)}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.84rem;font-weight:600;white-space:nowrap}
.badge.retard{background:#F8DAD7;color:var(--retard)}
.badge.resa{background:#DCE6F5;color:var(--resa)}
.badge.moi-b{background:#FCEFC7;color:#6B5200}
.st-libre{color:var(--libre);font-weight:600}
.st-pris{color:var(--pris);font-weight:600}
.vide{color:var(--gris);padding:14px;margin:0;background:var(--papier);border:1px dashed var(--trait);border-radius:var(--r)}
li.vide{border:0;border-radius:0}
.discret{color:var(--gris);margin:0}

/* Formulaires */
label{display:block;font-weight:600;margin-top:12px}
.opt{font-weight:400;color:var(--gris);font-size:.88rem}
.qui{margin:10px 0 0;color:var(--gris)}
.qui strong{color:var(--encre)}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-weight:400;padding:10px 12px;
  border:1px solid #AEB8C1;border-radius:var(--r);background:#fff;color:var(--encre)}
textarea{resize:vertical}
input[type=search]{margin:0 0 10px}
.filtres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filtre{border:1px solid #AEB8C1;background:var(--papier);border-radius:999px;padding:6px 14px;
  font:500 .95rem 'Barlow',sans-serif;cursor:pointer;color:var(--encre)}
.filtre.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.deux{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=date]{min-width:0}
.btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:var(--r);
  font:700 1.12rem 'Barlow Condensed',sans-serif;color:#fff;background:var(--encre);cursor:pointer}
.btn-prendre{background:var(--pris)}
.btn-rendre{background:var(--libre)}
.btn-resa{background:var(--resa)}
.btn:disabled{opacity:.55;cursor:progress}
.btn-lien{border:0;background:none;color:var(--retard);font:600 .95rem 'Barlow',sans-serif;cursor:pointer;padding:6px 4px}

/* Connexion */
.connexion{max-width:420px;margin:32px auto 0;padding:20px;background:var(--papier);border:1px solid var(--trait);border-radius:var(--r)}
.connexion h1{margin:0 0 6px}
.connexion p{margin:0;color:var(--gris)}
.cx-err{margin-top:12px!important;color:var(--retard)!important;font-weight:600}

/* Fiche */
.retour{display:inline-block;margin-top:12px;color:var(--gris);text-decoration:none;font-weight:600}
.retour:hover{color:var(--encre)}
.fiche-tete{margin-top:12px}
.cat{margin:2px 0 0;color:var(--gris)}
.etat{margin-top:16px;padding:14px 16px;background:var(--papier);border:1px solid var(--trait);
  border-left:6px solid var(--trait);border-radius:var(--r)}
.etat-titre{margin:0;font:700 1.3rem 'Barlow Condensed',sans-serif}
.etat.is-libre .etat-titre{color:var(--libre)}
.etat.is-pris .etat-titre{color:var(--pris)}
.etat.is-retard .etat-titre{color:var(--retard)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 0}
dt{color:var(--gris)} dd{margin:0}
.action{margin-top:16px;padding:16px;background:var(--papier);border:1px solid var(--trait);border-radius:var(--r)}
.resas{list-style:none;padding:0;margin:0 0 10px}
.resas li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 10px 14px;
  background:var(--papier);border:1px solid var(--trait);border-left:5px solid var(--resa);
  border-radius:var(--r);margin-bottom:6px}
.reserver{background:var(--papier);border:1px solid var(--trait);border-radius:var(--r);padding:0 16px}
.reserver summary{cursor:pointer;padding:14px 0;font-weight:600;color:var(--resa)}
.reserver form{padding-bottom:16px}

/* Historique */
.histo{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--trait)}
.histo li{position:relative;padding:4px 0 12px 8px}
.histo li::before{content:'';position:absolute;left:-22px;top:9px;width:10px;height:10px;border-radius:50%;
  background:var(--fond);border:2px solid var(--gris)}
.histo time{display:block;font-size:.85rem;color:var(--gris)}
.histo em{display:block;color:var(--gris)}

/* Messages */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  background:var(--encre);color:#fff;padding:12px 18px;border-radius:var(--r);max-width:calc(100% - 32px);
  font-weight:600;box-shadow:0 6px 20px rgba(28,38,48,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--retard)}
.chargement{padding:48px 0;text-align:center;color:var(--gris)}
.erreur{margin-top:24px;padding:16px;background:var(--papier);border:1px solid var(--trait);
  border-left:6px solid var(--retard);border-radius:var(--r)}
.erreur .btn{width:auto;padding:10px 18px}

/* Certificats */
.badge.cert-ok{background:#DDEFE3;color:var(--libre)}
.badge.cert-bientot{background:#FBE7CF;color:#8A4B0B}
.badge.cert-expire{background:#F8DAD7;color:var(--retard)}
.cert{margin-top:16px;padding:12px 16px;background:var(--papier);border:1px solid var(--trait);
  border-left:6px solid var(--libre);border-radius:var(--r)}
.cert.cert-bientot{border-left-color:var(--pris)}
.cert.cert-expire{border-left-color:var(--retard)}
.cert-titre{margin:0;font-weight:600}
.cert-bientot .cert-titre{color:#8A4B0B}
.cert-expire .cert-titre{color:var(--retard)}
.lien-cert{display:inline-block;margin-top:8px;color:var(--resa);font-weight:600}
.badge.cert-controle{background:#DCE6F5;color:var(--resa)}
.cert.cert-controle{border-left-color:var(--resa)}
.cert-controle .cert-titre{color:var(--resa)}
.st-controle{color:var(--resa);font-weight:600}
.etat.is-resa .etat-titre{color:var(--resa)}
.btn-depot{background:var(--resa);margin-top:12px;width:auto;max-width:100%;padding:12px 16px}
.info-ctl{margin:8px 0 0;font-size:.88rem;color:var(--gris)}

/* Administration */
a.filtre{text-decoration:none;display:inline-block}
.ligne-btn{width:100%;text-align:left;background:none;border:0;border-left:5px solid var(--trait);
  font:inherit;color:inherit;cursor:pointer}
.ligne-simple{display:block}
.adm-barre{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.adm-barre input{margin:0;flex:1 1 200px;min-width:0}
.btn-petit{width:auto;margin:0;padding:10px 14px;font-size:1rem;white-space:nowrap}
.case{display:flex;gap:8px;align-items:center;font-weight:500}
.case input{width:auto;margin:0}
fieldset{border:1px solid var(--trait);border-radius:var(--r);margin:16px 0 0;padding:4px 12px 12px;min-width:0}
legend{font-weight:600;padding:0 4px}
.config h2{margin:24px 0 0}
dialog{border:0;border-radius:var(--r);padding:20px;width:calc(100% - 24px);max-width:520px;
  max-height:calc(100% - 24px);color:var(--encre)}
dialog::backdrop{background:rgba(28,38,48,.55)}
dialog h2{margin:0 0 4px}
.dlg-btns{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:18px}
.dlg-btns .btn{width:auto;margin:0;padding:10px 18px}
.dlg-btns .btn-lien{color:var(--gris)}
.dlg-err{color:var(--retard);font-weight:600;margin:12px 0 0}
.dlg-err:empty{display:none}

/* Mon suivi */
.dot>summary{list-style:none}
.dot>summary::-webkit-details-marker{display:none}
.dot[open]>summary{background:#F4F6F8}
.dot-detail{padding:4px 14px 14px 22px;border-left:5px solid var(--trait)}
.dot-detail dl{margin-top:6px}
.sans-ech{color:var(--gris);font-size:.88rem}

/* Sélecteur Drive */
.lien-ligne{display:flex;gap:8px;align-items:center;margin-top:4px}
.lien-ligne input{margin:0;flex:1;min-width:0}
.btn-drive{background:var(--resa)}
.drive{margin-top:8px;border:1px solid var(--trait);border-radius:var(--r);background:#F8FAFB;padding:8px}
.drive input{margin:0 0 6px}
.drive-liste{max-height:260px;overflow:auto}
.drive-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--trait);
  padding:8px 4px;font:inherit;color:inherit;cursor:pointer}
.drive-item:hover{background:#EEF2F5}
.drive-item small{display:block;color:var(--gris)}
.lien-choisi{margin:4px 0 0;font-size:.88rem;color:var(--libre);font-weight:600}
.lien-choisi:empty{display:none}

:focus-visible{outline:3px solid var(--resa);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="brand-titre">Matériel atelier</span>
      <span class="brand-sous">Paganetti Thermique</span>
      <span class="moi" id="moi"></span>
    </div>
    <nav id="nav" hidden>
      <button class="tab" data-tab="accueil" type="button">Empruntés<span class="compteur" id="nbPris"></span></button>
      <button class="tab" data-tab="liste" type="button">Tout le matériel</button>
      <button class="tab" data-tab="suivi" type="button" id="tabSuivi" hidden>Mon suivi<span class="compteur alerte" id="nbSuivi"></span></button>
      <button class="tab" data-tab="admin" type="button" id="tabAdmin" hidden>Admin</button>
    </nav>
    <div class="connexion-vide" id="cxVide"></div>
  </div>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
let S = null, DATA = null, FICHE = null, ADM = null, occupe = false;
const st = { vue: '', id: '', q: '', cat: '', qs: '', adm: 'equipements', admQ: '', admTech: '', voirRetires: false };
const $ = s => document.querySelector(s);
const app = $('#app');

// ---------- Utilitaires ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const fr = s => { if (!s) return ''; const [y, m, d] = s.slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const frH = s => s ? `${fr(s)} à ${s.slice(11, 16)}` : '';
const enRetard = e => e.statut === 'Pris' && e.retourPrevu && DATA && e.retourPrevu < DATA.aujourdhui;
const admin = () => S && S.role === 'Admin';

function stocker(cle, v) {
  try {
    if (v === null) localStorage.removeItem(cle);
    else if (v !== undefined) localStorage.setItem(cle, JSON.stringify(v));
    return JSON.parse(localStorage.getItem(cle) || 'null');
  } catch (e) { return v || null; }
}

async function api(params) {
  const corps = Object.assign({}, params, S ? { token: S.token } : {});
  const r = await fetch(SCRIPT_URL + '?p=' + encodeURIComponent(JSON.stringify(corps)));
  if (!r.ok) throw new Error('La base de données ne répond pas (code ' + r.status + ').');
  const j = await r.json();
  if (j.auth) { deconnecter(j.error); throw new Error(j.error); }
  if (j.error) throw new Error(j.error);
  return j;
}

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = '', err ? 6000 : 3000);
}

const chargement = (txt = 'Chargement…') => `<p class="chargement">${txt}</p>`;
function erreur(err) {
  return `<div class="erreur"><p><strong>Impossible d’afficher la page.</strong></p><p>${esc(err.message)}</p>
    <p>Vérifiez la connexion réseau puis réessayez.</p>
    <button class="btn" type="button" onclick="demarrer()">Réessayer</button></div>`;
}

// ---------- Session ----------
function majEntete() {
  $('#nav').hidden = !S;
  $('#cxVide').hidden = !!S;
  $('#tabAdmin').hidden = !admin();
  $('#moi').innerHTML = S
    ? `<strong>${esc(S.nom)}</strong>${admin() ? ' (admin)' : ''}<button class="btn-deco" type="button" id="btnDeco">Se déconnecter</button>`
    : '';
  $('#btnDeco')?.addEventListener('click', () => deconnecter());
}

function deconnecter(msg) {
  if ($('#dlg').open) $('#dlg').close();
  S = null; DATA = null; FICHE = null; ADM = null;
  stocker('pm_session', null);
  stocker('pm_cache', null);
  majEntete();
  vueConnexion(msg);
}

function vueConnexion(msg) {
  st.vue = 'connexion';
  app.innerHTML = `<section class="connexion">
    <h1>Connexion</h1>
    <p>Identifiez-vous pour prendre, rendre ou réserver du matériel. Vous resterez connecté sur cet appareil.</p>
    ${msg ? `<p class="cx-err">${esc(msg)}</p>` : ''}
    <form id="fCx">
      <label>Identifiant <input id="cxId" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Code <input id="cxCode" type="password" autocomplete="current-password" required></label>
      <button class="btn">Se connecter</button>
    </form></section>`;
  $('#fCx').addEventListener('submit', async ev => {
    ev.preventDefault();
    const b = ev.target.querySelector('button');
    b.disabled = true; b.textContent = 'Connexion…';
    const ident = $('#cxId').value.trim();
    try {
      const r = await api({ action: 'connexion', identifiant: ident, code: $('#cxCode').value });
      S = stocker('pm_session', r.session);
      demarrer();
    } catch (err) {
      vueConnexion(err.message);
      $('#cxId').value = ident;
      $('#cxCode').focus();
    }
  });
}

// ---------- Chargement et navigation ----------
async function charger() {
  DATA = await api({ action: 'init' });
  stocker('pm_cache', DATA);
  majCompteur();
}
function majCompteur() {
  $('#nbPris').textContent = DATA ? (DATA.equipements.filter(e => e.statut === 'Pris').length || '') : '';
  const dots = (DATA && DATA.mesDotations) || [];
  $('#tabSuivi').hidden = !dots.length;
  $('#nbSuivi').textContent = dots.filter(d => { const c = certif(d); return c && (c.cls === 'expire' || c.cls === 'bientot'); }).length || '';
}

function router() {
  const p = new URLSearchParams(location.search);
  const id = p.get('id');
  if (id) { st.vue = 'fiche'; st.id = id; majTabs(null); afficherFiche(id); return; }
  const v = p.get('vue');
  st.vue = v === 'liste' ? 'liste' : v === 'suivi' ? 'suivi' : (v === 'admin' && admin() ? 'admin' : 'accueil');
  st.id = '';
  majTabs(st.vue);
  if (st.vue === 'liste') vueListe();
  else if (st.vue === 'suivi') vueSuivi();
  else if (st.vue === 'admin') vueAdmin();
  else vueAccueil();
}

// Mise à jour silencieuse après réception de données fraîches
function rafraichir() {
  if (st.vue === 'accueil') vueAccueil();
  else if (st.vue === 'liste') remplirListe();
  else if (st.vue === 'suivi') remplirSuivi();
}

function aller(params) {
  const u = new URL(location.href);
  u.search = '';
  Object.entries(params).forEach(([k, v]) => v && u.searchParams.set(k, v));
  history.pushState({}, '', u);
  window.scrollTo(0, 0);
  router();
}

function majTabs(vue) {
  document.querySelectorAll('.tab[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === vue));
}

document.querySelectorAll('.tab[data-tab]').forEach(b =>
  b.addEventListener('click', () => aller(b.dataset.tab === 'accueil' ? {} : { vue: b.dataset.tab })));

document.addEventListener('click', ev => {
  const a = ev.target.closest('a[data-nav]');
  if (!a || ev.ctrlKey || ev.metaKey) return;
  ev.preventDefault();
  aller(Object.fromEntries(new URL(a.href).searchParams));
});
window.addEventListener('popstate', () => { if (S) router(); });

// Retour sur l'onglet : on rafraîchit en arrière-plan
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S && ['accueil', 'liste', 'suivi'].includes(st.vue)) charger().then(rafraichir).catch(() => {});
});

async function demarrer() {
  if (typeof SCRIPT_URL === 'undefined' || !SCRIPT_URL || SCRIPT_URL.includes('COLLER')) {
    app.innerHTML = `<div class="erreur"><p><strong>Base de données non configurée.</strong></p>
      <p>Renseignez l’URL du déploiement Apps Script dans le fichier config.js.</p></div>`;
    return;
  }
  S = stocker('pm_session');
  majEntete();
  if (!S) { vueConnexion(); return; }

  const cache = stocker('pm_cache');
  if (cache) { DATA = cache; majCompteur(); router(); }   // affichage immédiat
  else app.innerHTML = chargement();

  try {
    await charger();
    if (cache) rafraichir(); else router();
  } catch (err) {
    if (!S) return;                       // session expirée : écran de connexion déjà affiché
    if (!cache) app.innerHTML = erreur(err);
    else toast('Affichage des dernières données connues : ' + err.message, true);
  }
}

async function afficherFiche(id) {
  const e = DATA && DATA.equipements.find(x => x.id === id);

    FICHE = { aujourdhui: DATA.aujourdhui, equipement: e,
      reservations: DATA.reservations.filter(r => r.id === id && r.au >= DATA.aujourdhui), historique: null };
    rendreFiche();

  if (o.statut !== n.statut || o.emprunteur !== n.emprunteur || o.retourPrevu !== n.retourPrevu) {

async function envoyer(params, msg) {
  if (occupe) return;
  occupe = true;
  app.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    let r = await api(params);
    if (r.warning) {
      if (!confirm(r.warning)) return;
      r = await api({ ...params, confirm: true });
      if (r.warning) throw new Error(r.warning);
    }
    DATA = r.etat;
    stocker('pm_cache', DATA);
    majCompteur();
    FICHE = r.fiche;
    toast(msg);
    rendreFiche();
    window.scrollTo(0, 0);
  } catch (err) {
    if (S) toast(err.message, true);
  } finally {
    occupe = false;
    app.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

// ---------- Certificats de contrôle ----------
function joursEntre(a, b) { return Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5); }
function certif(e) {
  if (!e || !DATA) return null;
  if (e.enControle) return { cls: 'controle', court: 'En contrôle', long: `en contrôle depuis le ${fr(e.enControle)}` };
  if (!e.echeance) return null;
  const j = joursEntre(e.echeance, DATA.aujourdhui), seuil = DATA.seuilCertif || 30;
  if (j < 0) return { cls: 'expire', court: 'Certificat expiré', long: `expiré depuis le ${fr(e.echeance)}` };
  if (j <= seuil) return { cls: 'bientot',
    court: j === 0 ? 'Certificat : expire aujourd’hui' : `Certificat : expire dans ${j} j`,
    long: `expire le ${fr(e.echeance)} (${j === 0 ? 'aujourd’hui' : 'dans ' + j + ' jour' + (j > 1 ? 's' : '')})` };
  return { cls: 'ok', court: 'Certificat valide', long: `valide jusqu’au ${fr(e.echeance)}` };
}
function htmlCertif(e) {
  const c = certif(Object.assign({}, e, { enControle: '' }));   // le statut « En contrôle » est affiché dans le bloc d'état
  if (!c) return '';
  const lien = /^https:\/\//.test(e.lienCertificat || '') ? e.lienCertificat : '';
  return `<section class="cert cert-${c.cls}">
    <p class="cert-titre">Certificat de contrôle ${c.long}</p>
    <dl>
      ${e.dernierControle ? `<dt>Dernier contrôle</dt><dd>${fr(e.dernierControle)}</dd>` : ''}
      ${e.echeance ? `<dt>Échéance</dt><dd>${fr(e.echeance)}</dd>` : ''}
      ${e.organisme ? `<dt>Organisme</dt><dd>${esc(e.organisme)}</dd>` : ''}
      ${e.numCertificat ? `<dt>N° de certificat</dt><dd>${esc(e.numCertificat)}</dd>` : ''}
    </dl>
    ${lien ? `<a class="lien-cert" href="${esc(lien)}" target="_blank" rel="noopener">Voir le certificat</a>` : ''}
  </section>`;
}

function listeAdmEq() {
  const q = norm(st.admQ.trim());
  const l = ADM.equipements
    .filter(e => (st.voirRetires || e.actif) && (!q || norm(e.id + ' ' + e.designation).includes(q)))
    .sort((a, b) => ordreCat(a.categorie) - ordreCat(b.categorie) || a.id.localeCompare(b.id));
  $('#admListe').innerHTML = l.length ? l.map(e => {

function admConfig() {
  const val = n => { const p = ADM.params.find(x => x.nom === n); return p ? String(p.valeur) : ''; };
  const champs = CHAMPS_CONF.map((c, i) => {
    if (c.titre) return `<h2>${c.titre}</h2>`;
    if (c.type === 'ouinon') return `<label class="case" style="margin-top:12px"><input type="checkbox" id="c${i}"${val(c.nom).toLowerCase() !== 'non' ? ' checked' : ''}> ${c.label}</label>`;
    if (c.type === 'emails') return `<label>${c.label} <span class="opt">${c.aide}</span><textarea id="c${i}" rows="2">${esc(val(c.nom))}</textarea></label>`;
    if (c.type === 'texte') return `<label>${c.label} <span class="opt">${c.aide || ''}</span><input id="c${i}" type="text" value="${esc(val(c.nom))}" autocomplete="off"></label>`;
    return `<label>${c.label}<input id="c${i}" type="${c.type === 'nombre' ? 'number' : 'url'}"${c.type === 'nombre' ? ' min="1" max="365" required' : ' required'} value="${esc(val(c.nom))}"></label>`;
  }).join('');
  $('#zAdm').innerHTML = `<form class="action config" id="fConf">
    <h2 style="margin-top:0">Catégories</h2>
    <label>Une catégorie par ligne <span class="opt">une catégorie encore utilisée ne peut pas être supprimée</span>
      <textarea id="cCats" rows="4">${esc(ADM.categories.join('\n'))}</textarea></label>
    ${champs}
    <p class="dlg-err" id="confErr"></p>
    <button class="btn">Enregistrer la configuration</button></form>`;
  $('#fConf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const b = ev.target.querySelector('.btn');
    b.disabled = true; $('#confErr').textContent = '';
    const params = {};
    CHAMPS_CONF.forEach((c, i) => {
      if (!c.nom) return;
      const el = $('#c' + i);
      params[c.nom] = c.type === 'ouinon' ? (el.checked ? 'Oui' : 'Non') : el.value.trim();
    });
    try {
      await admEnvoyer({ op: 'config', categories: $('#cCats').value.split('\n').map(x => x.trim()).filter(Boolean), params },
        'Configuration enregistrée');
    } catch (err) { $('#confErr').textContent = err.message; b.disabled = false; }
  });
}

// ---------- Mon suivi d'équipement (dotations) ----------
function texteControle(d) {
  const c = certif(d);
  if (!c) return '';
  if (c.cls === 'controle') return 'En contrôle';
  if (c.cls === 'expire') return 'Contrôle en retard';
  if (c.cls === 'ok') return 'À jour';
  const j = joursEntre(d.echeance, DATA.aujourdhui);
  return j === 0 ? 'Contrôle aujourd’hui' : `Contrôle sous ${j} j`;
}
function vueSuivi() {
  const l = (DATA && DATA.mesDotations) || [];
  app.innerHTML = `<section class="bloc"><h2>Mon suivi d’équipement</h2>
    <p class="resume">Les équipements qui vous sont attribués et leurs contrôles périodiques. Touchez une ligne pour voir le détail.</p>
    ${l.length > 4 ? `<input id="qs" type="search" placeholder="Rechercher un équipement" value="${esc(st.qs)}" autocomplete="off" aria-label="Rechercher">` : ''}
    <ul class="lignes" id="listeSuivi"></ul></section>`;
  $('#qs')?.addEventListener('input', ev => { st.qs = ev.target.value; remplirSuivi(); });
  remplirSuivi();
}

function remplirSuivi() {
  const el = $('#listeSuivi');
  if (!el) return;
  const q = norm(st.qs.trim());
  const l = ((DATA && DATA.mesDotations) || [])
    .filter(d => !q || norm([d.id, d.designation, d.numSerie, d.organisme, d.categorie].join(' ')).includes(q));
  el.innerHTML = l.length ? l.map(d => {
    const c = certif(d);
    const cls = !c ? '' : c.cls === 'expire' ? 'is-retard' : c.cls === 'bientot' ? 'is-pris' : c.cls === 'controle' ? 'is-resa' : 'is-libre';
    const lien = /^https:\/\//.test(d.lienCertificat || '') ? d.lienCertificat : '';
    const badge = !c ? '<span class="sans-ech">Échéance non renseignée</span>'
      : c.cls === 'controle' ? '<span class="badge cert-controle">En contrôle</span>'
      : c.cls === 'expire' ? '<span class="badge cert-expire">Contrôle en retard</span>'
      : c.cls === 'bientot' ? `<span class="badge cert-bientot">${texteControle(d)}</span>`
      : '<span class="badge cert-ok">À jour</span>';
    return `<li><details class="dot"><summary class="ligne ${cls}">
        <span class="tag">${esc(d.id)}</span>
        <span class="l-main"><span class="l-titre">${esc(d.designation)}</span>
          <span class="l-meta">${[d.numSerie ? 'N° série ' + esc(d.numSerie) : '', d.organisme ? esc(d.organisme) : ''].filter(Boolean).join(' · ')}</span></span>
        <span class="l-fin">${badge}</span></summary>
      <div class="dot-detail ${cls}">
        ${c ? `<p class="cert-titre" style="margin:8px 0 0">${c.cls === 'controle' ? 'Déposé en contrôle le ' + fr(d.enControle)
          : c.cls === 'expire' ? 'Contrôle en retard : échéance dépassée le ' + fr(d.echeance)
          : 'Prochain contrôle avant le ' + fr(d.echeance)}</p>` : ''}
        <dl>
          ${d.categorie ? `<dt>Catégorie</dt><dd>${esc(d.categorie)}</dd>` : ''}
          ${d.numSerie ? `<dt>N° de série</dt><dd>${esc(d.numSerie)}</dd>` : ''}
          <dt>Organisme</dt><dd>${d.organisme ? esc(d.organisme) : 'Non renseigné'}</dd>
          ${d.dernierControle ? `<dt>Dernier contrôle</dt><dd>${fr(d.dernierControle)}</dd>` : ''}
          <dt>Échéance</dt><dd>${d.echeance ? fr(d.echeance) : 'Non renseignée'}</dd>
          ${d.numCertificat ? `<dt>Certificat / rapport</dt><dd>${esc(d.numCertificat)}</dd>` : ''}
          ${d.remarque ? `<dt>Remarque</dt><dd>${esc(d.remarque)}</dd>` : ''}
        </dl>
        ${lien ? `<a class="lien-cert" href="${esc(lien)}" target="_blank" rel="noopener">Voir le certificat / rapport</a>` : ''}
        ${d.enControle
          ? '<p class="info-ctl">Les rappels sont suspendus. Le statut se retirera dès que le service QSSE aura saisi le nouveau certificat.</p>'
          : `<button type="button" class="btn btn-depot" data-depot="${esc(d.id)}">J’ai déposé l’équipement en contrôle</button>`}
      </div></details></li>`;
  }).join('') : '<li class="vide">Aucun équipement ne correspond.</li>';
  el.querySelectorAll('[data-depot]').forEach(b => b.addEventListener('click', async () => {
    const d = DATA.mesDotations.find(x => x.id === b.dataset.depot);
    if (!confirm('Confirmer le dépôt en contrôle de ' + d.designation + (d.organisme ? ' chez ' + d.organisme : '') +
      ' ?\nLes rappels seront suspendus jusqu’au retour du certificat.')) return;
    b.disabled = true; b.textContent = 'Enregistrement…';
    try {
      DATA = (await api({ action: 'deposer', id: d.id })).etat;
      stocker('pm_cache', DATA); majCompteur(); remplirSuivi();
      toast('Dépôt en contrôle enregistré');
    } catch (err) { toast(err.message, true); b.disabled = false; b.textContent = 'J’ai déposé l’équipement en contrôle'; }
  }));
}

  $('#admListe').innerHTML = (l.length ? `<li class="vide" style="border:0">${l.length} dotation${l.length > 1 ? 's' : ''}${
    nbRetard ? `, dont <strong class="txt-retard">${nbRetard} en retard de contrôle</strong>` : ''}</li>` : '') +

      const c = certif(d);

    <fieldset><legend>Contrôle périodique</legend>
      <label>Organisme de contrôle <input name="organisme" list="dlOrg" value="${v('organisme')}" autocomplete="off"></label>
      <div class="deux">
        <label>Dernier contrôle <input type="date" name="dernierControle" value="${v('dernierControle')}"></label>
        <label>Échéance <input type="date" name="echeance" value="${v('echeance')}"></label>
      </div>
      <label>N° de certificat / rapport <input name="numCertificat" value="${v('numCertificat')}" autocomplete="off"></label>
      ${champLien(v('lienCertificat'), 'Lien vers le certificat / rapport')}

    <label>Remarque <span class="opt">facultatif</span><textarea name="remarque" rows="2">${v('remarque')}</textarea></label>
    <datalist id="dlCat">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <datalist id="dlOrg">${orgs.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`,

let FICHIERS = null;

function champLien(valeur, label) {
  return `<div style="margin-top:12px"><span style="font-weight:600">${label}</span>
    <div class="lien-ligne">
      <input type="url" name="lienCertificat" id="fLien" value="${valeur}" placeholder="https://drive.google.com/…">
      <button type="button" class="btn btn-petit btn-drive" id="btnDrive">Drive</button>
    </div>
    <p class="lien-choisi" id="fLienNom"></p>
    <div class="drive" id="zDrive" hidden></div></div>`;
}

function brancherDrive() {
  const b = $('#btnDrive');
  if (!b) return;
  b.addEventListener('click', async () => {
    const z = $('#zDrive');
    if (!z.hidden) { z.hidden = true; return; }
    z.hidden = false;
    if (!FICHIERS) {
      z.innerHTML = '<p class="discret">Lecture du dossier Drive…</p>';
      try { FICHIERS = (await api({ action: 'admin', op: 'fichiers' })).fichiers; }
      catch (err) { z.innerHTML = `<p class="dlg-err">${esc(err.message)}</p>`; return; }
    }
    z.innerHTML = `<input type="search" id="qDrive" placeholder="Rechercher un fichier (nom, n° de série, organisme…)" autocomplete="off">
      <div class="drive-liste" id="lDrive"></div>
      <button type="button" class="btn-lien" id="rDrive" style="color:var(--resa)">Actualiser la liste</button>`;
    const afficher = () => {
      const q = norm($('#qDrive').value.trim());
      const l = FICHIERS.filter(f => !q || norm(f.nom + ' ' + f.dossier).includes(q));
      $('#lDrive').innerHTML = l.length ? l.slice(0, 60).map((f, i) =>
        `<button type="button" class="drive-item" data-i="${FICHIERS.indexOf(f)}">${esc(f.nom)}
          <small>${f.dossier ? esc(f.dossier) + ' · ' : ''}modifié le ${fr(f.maj)}</small></button>`).join('') +
        (l.length > 60 ? `<p class="discret" style="padding:6px 4px">${l.length - 60} autres fichiers : affinez la recherche.</p>` : '')
        : '<p class="discret" style="padding:6px 4px">Aucun fichier trouvé.</p>';
      $('#lDrive').querySelectorAll('[data-i]').forEach(x => x.addEventListener('click', () => {
        const f = FICHIERS[+x.dataset.i];
        $('#fLien').value = f.url;
        $('#fLienNom').textContent = 'Fichier choisi : ' + f.nom;
        z.hidden = true;
      }));
    };
    $('#qDrive').addEventListener('input', afficher);
    $('#rDrive').addEventListener('click', () => { FICHIERS = null; z.hidden = true; b.click(); });
    afficher();
    $('#qDrive').focus();
  });
}

// ---------- Case « En contrôle » des formulaires admin ----------
function caseControle(x, commun) {
  if (!x) return '';      // pas de dépôt en contrôle à la création
  return `<label class="case" style="margin-top:14px"><input type="checkbox" name="enControle"${x.enControle ? ' checked' : ''}>
      Déposé en contrôle <span class="opt">${x.enControle ? 'depuis le ' + fr(x.enControle) : '(suspend les rappels)'}</span></label>
    <p class="info-ctl">Se décoche automatiquement quand vous saisissez une nouvelle échéance.${
      commun ? ' Un équipement en contrôle ne peut pas être emprunté.' + (x.statut === 'Pris' && !x.enControle
        ? ` <strong>Pris par ${esc(x.emprunteur)} : il sera rendu automatiquement.</strong>` : '') : ''}</p>`;
}

demarrer();
</script>
